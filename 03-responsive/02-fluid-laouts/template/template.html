<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Learn fluid layout techniques using relative and viewport units in CSS."
        />
        <meta
            name="keywords"
            content="Fluid Layout, Responsive Design, CSS, Frontend"
        />
        <meta name="author" content="Rayhana Akter Sumaya" />
        <title>Fluid Layouts</title>

        <!-- CSS links -->
        0
        <link rel="stylesheet" href="/reset.css" />
        <link rel="stylesheet" href="template-style.css" />
    </head>
    <body>
        <h1>Fluid Layouts</h1>

        <main>
            <section class="container">
                <header class="header">
                    Header - 10vh height, full viewport width
                </header>
                <article class="content">
                    <p>
                        This container is 80% wide, centered, and resizes
                        fluidly with the viewport.
                    </p>
                    <p>
                        The max-width limits how wide it grows on large screens.
                    </p>
                </article>
                <footer class="footer">Footer</footer>
            </section>
        </main>
    </body>
</html>
