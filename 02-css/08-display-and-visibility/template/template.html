    Purpose: Practice and demonstrate how the 'display' and 'visibility' properties work in CSS.
    Features:
        - Examples of block, inline, inline-block, and none display types
        - Examples of visible and hidden visibility states

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Practice examples of CSS display and visibility properties."
        />
        <meta
            name="keywords"
            content="CSS, display, visibility, block, inline, frontend"
        />
        <meta name="author" content="Rayhana Akter Sumaya" />
        <title>CSS Display and Visibility</title>

        <!-- CSS links -->
        <link rel="stylesheet" href="/02-css/reset.css" />
        <link rel="stylesheet" href="template-style.css" />
    </head>
    <body>
        <main>
            <h1>CSS Display and Visibility Practice</h1>

            <section>
                <h2>Display Property Examples</h2>
                <div class="box block">Block Element</div>
                <span class="box inline">Inline Element</span>
                <div class="box inline-block">Inline-Block Element</div>
                <div class="box none">Display: none (Hidden)</div>
            </section>

            <section>
                <h2>Visibility Property Examples</h2>
                <p class="visible-text">This paragraph is visible.</p>
                <p class="hidden-text">
                    This paragraph is hidden (visibility: hidden).
                </p>
            </section>
        </main>
    </body>
</html>
