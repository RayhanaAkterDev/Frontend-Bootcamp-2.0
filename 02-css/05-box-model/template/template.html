<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Practice page demonstrating the CSS box model including content, padding, border, margin, and box-sizing property."
        />
        <meta
            name="keywords"
            content="CSS, box model, padding, border, margin, box-sizing, frontend"
        />
        <meta name="author" content="Rayhana Akter Sumaya" />
        <title>CSS Box Model Practice</title>

        <!-- CSS links -->
        <link rel="stylesheet" href="/02-css/reset.css" />
        <link rel="stylesheet" href="template-style.css" />
    </head>
    <body>
        <main>
            <h1>CSS Box Model Practice</h1>

            <div
                class="box"
                aria-label="Box demonstrating CSS box model properties"
            >
                This is a box element.
            </div>

            <p>
                Observe how the <strong>content</strong>,
                <strong>padding</strong>, <strong>border</strong>, and
                <strong>margin</strong> affect the space and layout of this box.
                Try changing <code>box-sizing</code> from
                <code>content-box</code> to <code>border-box</code> in the CSS
                to see how the total size is affected.
            </p>
        </main>
    </body>
</html>
